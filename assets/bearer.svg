<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" role="img" aria-label="The Bearer: a graduate figure holding the iusethis mark to their chest like a diploma">
  <style>
    .figure { fill: #5c3a24; }  /* head, hands, mortarboard */
    .gown   { fill: #175a43; }
    .rim    { fill: #8c6d1f; }
    .face   { fill: #c9a227; }
    .mark-i { fill: #2a1d12; }
    .tassel { stroke: #c9a227; fill: #c9a227; }
    @media (prefers-color-scheme: dark) {
      .figure { fill: #c08a5f; }
      .gown   { fill: #4fa47e; }
    }
  </style>

  <!-- head -->
  <circle class="figure" cx="110" cy="74" r="26"/>
  <!-- mortarboard -->
  <polygon class="figure" points="60,44 110,22 160,44 110,66"/>
  <path class="tassel" stroke-width="3" fill="none" d="M 160 44 L 164 78"/>
  <circle class="tassel" cx="164" cy="83" r="5"/>
  <!-- gown -->
  <path class="gown" d="M 34 250 L 34 170 Q 34 112 110 112 Q 186 112 186 170 L 186 250 Z"/>
  <!-- the mark, held to the chest like a diploma: the seal as a book cover,
       carrying all three elements — I. / Use. / This. with the arrow-T -->
  <rect class="rim"  x="58" y="140" width="104" height="84" rx="6"/>
  <rect class="face" x="64" y="146" width="92"  height="72" rx="4"/>
  <text class="mark-i" x="110" y="168" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-weight="700" font-size="17">I.</text>
  <text class="mark-i" x="110" y="188" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-weight="700" font-size="17">Use.</text>
  <path class="mark-i" d="M 88 196 H 100 V 199 H 95.5 V 210 H 102 L 94 220 L 86 210 H 92.5 V 199 H 88 Z"/>
  <text class="mark-i" x="103" y="208" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-weight="700" font-size="17">his.</text>
  <!-- hands -->
  <circle class="figure" cx="70"  cy="226" r="9"/>
  <circle class="figure" cx="150" cy="226" r="9"/>
</svg>
